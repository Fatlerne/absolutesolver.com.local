    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #030405;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.03) 0px,
                rgba(0, 0, 0, 0.03) 1px,
                transparent 1px,
                transparent 3px
            );
        }

        .scanlines::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(3, 4, 5, 0) 50%,
                rgba(0, 0, 0, 0.15) 50%
            );
            background-size: 100% 4px;
            animation: scanline-move 8s linear infinite;
            opacity: 0.3;
        }

        @keyframes scanline-move {
            0% { transform: translateY(0); }
            100% { transform: translateY(12px); }
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 10;
            padding: 2rem;
        }

        .error-code {
            font-size: clamp(4rem, 12vw, 10rem);
            font-weight: bold;
            color: #fff;
            position: relative;
            animation: glitch-text 3s infinite;
            text-shadow: 
                0.05em 0 0 rgba(255, 0, 0, 0.75),
                -0.025em -0.05em 0 rgba(0, 255, 0, 0.75),
                0.025em 0.05em 0 rgba(0, 0, 255, 0.75);
        }

        .error-code::before,
        .error-code::after {
            content: 'ERROR 404';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .error-code::before {
            color: #fff;
            animation: glitch-clip-1 2s infinite linear alternate-reverse;
            clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%);
            transform: translateX(-0.04em);
            text-shadow: -2px 0 #ff0040;
        }

        .error-code::after {
            color: #fff;
            animation: glitch-clip-2 2.5s infinite linear alternate-reverse;
            clip-path: polygon(0 67%, 100% 67%, 100% 100%, 0 100%);
            transform: translateX(0.04em);
            text-shadow: 2px 0 #0ff;
        }

        @keyframes glitch-text {
            0%, 90%, 100% { transform: none; opacity: 1; }
            91% { transform: skew(-0.5deg, -0.5deg); }
            92% { transform: none; }
            93% { transform: skew(0.5deg); opacity: 0.8; }
            94% { transform: none; opacity: 1; }
        }

        @keyframes glitch-clip-1 {
            0% { clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%); }
            20% { clip-path: polygon(0 15%, 100% 15%, 100% 45%, 0 45%); }
            40% { clip-path: polygon(0 5%, 100% 5%, 100% 25%, 0 25%); }
            60% { clip-path: polygon(0 40%, 100% 40%, 100% 60%, 0 60%); }
            80% { clip-path: polygon(0 20%, 100% 20%, 100% 50%, 0 50%); }
            100% { clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%); }
        }

        @keyframes glitch-clip-2 {
            0% { clip-path: polygon(0 67%, 100% 67%, 100% 100%, 0 100%); }
            25% { clip-path: polygon(0 55%, 100% 55%, 100% 85%, 0 85%); }
            50% { clip-path: polygon(0 70%, 100% 70%, 100% 95%, 0 95%); }
            75% { clip-path: polygon(0 60%, 100% 60%, 100% 90%, 0 90%); }
            100% { clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%); }
        }

        .file-not-found {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: rgba(224, 224, 224, 0.5);
            margin-top: 1.5rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        .moved-hint {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: rgba(224, 224, 224, 0.25);
            margin-top: 1rem;
            font-style: italic;
        }

        .solver-symbol {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
            animation: solver-flicker 7s infinite;
            opacity: 0;
        }

        .solver-symbol img {
            width: clamp(160px, 25vw, 400px);
            height: auto;
            filter: brightness(0.3) hue-rotate(320deg) saturate(0.5);
        }

        @keyframes solver-flicker {
            0%, 84%, 86%, 100% { opacity: 0; }
            85% { opacity: 1; }
            85.1% { opacity: 0; }
            92% { opacity: 0; }
            92.5% { opacity: 0.6; }
            92.6% { opacity: 0; }
        }
    </style>
</head>
